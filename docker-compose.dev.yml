# LOCAL DEV ONLY — not used in production.
# Production runs entirely on Vercel (Next.js serverless + Upstash Redis).
#
# This file provides a local Redis instance for developers who prefer not to
# create an Upstash account just for local development. The Next.js app
# connects to it via UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN.
#
# NOTE: Upstash's local emulator or a plain Redis instance both work.
# For the app to connect, you still need a REST-compatible adapter.
# The easiest local option is to use Upstash's free cloud tier directly.
# This compose file is kept for reference / advanced local setups only.
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nexar-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
