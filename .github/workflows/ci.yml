name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Tailwind native binding for Linux
        run: npm install @tailwindcss/oxide-linux-x64-gnu --no-save
        working-directory: frontend
        # Workaround: npm optional deps bug - ensure oxide native binding for ubuntu-latest

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Provide dummy values so the build doesn't fail on missing env vars
          NEXTAUTH_SECRET: ci-secret-not-used-in-production
          NEXTAUTH_URL: http://localhost:3000
