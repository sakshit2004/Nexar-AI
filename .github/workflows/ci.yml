name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        # Run from repo root so npm workspaces hoist correctly and
        # @tailwindcss/oxide native bindings install for the CI platform

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Provide dummy values so the build doesn't fail on missing env vars
          NEXTAUTH_SECRET: ci-secret-not-used-in-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Test
        run: npm test
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-secret-not-used-in-production
          NEXTAUTH_URL: http://localhost:3000
